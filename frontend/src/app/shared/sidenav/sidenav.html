<aside
	class="sidenav-panel"
	[class.expanded]="expanded()"
	aria-label="Menu lateral de navegação"
>
	<a class="sidenav-brand" routerLink="/catalogo" aria-label="Ir para a página inicial da SafeMugs">
		<mat-icon class="brand-mark-icon" aria-hidden="true">emoji_food_beverage</mat-icon>
		<span class="brand-text">SafeMugs</span>
	</a>

	<nav class="sidenav-nav" aria-label="Atalhos da aplicação">
		<button
			type="button"
			class="nav-item nav-item--carrinho"
			(click)="carrinhoClick()"
			matTooltip="Carrinho"
			[matTooltipDisabled]="expanded()"
		>
			<mat-icon aria-hidden="true">shopping_basket</mat-icon>
			<span class="nav-label">Carrinho</span>
		</button>

		<button
			type="button"
			class="nav-item nav-item--avaliacoes"
			(click)="avaliacoesClick()"
			matTooltip="Avaliações"
			[matTooltipDisabled]="expanded()"
		>
			<mat-icon aria-hidden="true">reviews</mat-icon>
			<span class="nav-label">Avaliações</span>
		</button>

		<button
			type="button"
			class="nav-item nav-item--github"
			(click)="githubClick()"
			matTooltip="GitHub"
			[matTooltipDisabled]="expanded()"
		>
			<svg class="gh-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
				<path
					d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0016 8c0-4.42-3.58-8-8-8z"
				/>
			</svg>
			<span class="nav-label">GitHub</span>
		</button>

		@if (showScoreBoard()) {
			<a
				class="nav-item nav-item--score"
				routerLink="/score-board"
				routerLinkActive="active"
				matTooltip="Score-Board"
				[matTooltipDisabled]="expanded()"
				>
				<mat-icon aria-hidden="true">emoji_events</mat-icon>
				<span class="nav-label">Score-Board</span>
			</a>
		}
	</nav>

	<div class="sidenav-bottom">
		@if (auth.autenticado()) {
			<div class="sidenav-footer">
				<button
					type="button"
					class="nav-item nav-item--perfil"
					routerLink="/score-board"
					routerLinkActive="active"
					matTooltip="Perfil"
					[matTooltipDisabled]="expanded()"
				>
					<mat-icon aria-hidden="true">account_circle</mat-icon>
					<span class="nav-label">Perfil</span>
				</button>

				<button
					type="button"
					class="nav-item nav-item--logout"
					(click)="logout()"
					matTooltip="Fazer Logout"
					[matTooltipDisabled]="expanded()"
				>
					<mat-icon aria-hidden="true">logout</mat-icon>
					<span class="nav-label">Fazer Logout</span>
				</button>
			</div>
		}

		<button
			type="button"
			class="sidenav-toggle"
			(click)="toggle()"
			[matTooltip]="toggleTooltip()"
			
			[attr.aria-label]="toggleTooltip()"
		>
			<mat-icon aria-hidden="true">{{ toggleIcon() }}</mat-icon>
		</button>
	</div>
</aside>
