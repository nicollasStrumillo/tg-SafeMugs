<div class="app-shell">
	<sm-sidenav />

	<div class="app-content">
		<header class="shell-header">
			<mat-toolbar class="topbar">
<div class="topbar-left">
				<a class="brand" routerLink="/catalogo" aria-label="Ir para a página inicial da SafeMugs">
						<mat-icon class="home-icon">emoji_food_beverage</mat-icon>
						<span class="brand-copy">
							<strong>{{ appName }}</strong>
							<small>Canecas para presentear e colecionar</small>
						</span>
					</a>
				</div>
				<nav class="topnav" aria-label="Navegação da conta">
				@if (auth.autenticado()) {	
					<a
						class="perfil-link"
						mat-ripple
						routerLink="/perfil"
						routerLinkActive="active-link"
						[routerLinkActiveOptions]="{ exact: true }"
					>
						<img
							class="avatar"
							[src]="auth.usuarioLogado()?.urlImagemPerfil"
							(error)="onFotoError($event)"
							alt="Foto de perfil"
						/>
						<span class="perfil-name"> {{ auth.usuarioLogado()?.nomeCompleto }} </span>
					</a>
					
				} @else {
					<a
						mat-button
						routerLink="/login"
						routerLinkActive="active-link"
						[routerLinkActiveOptions]="{ exact: true }"
					>
						Entrar
					</a>
					<a mat-button routerLink="/register" routerLinkActive="active-link">Cadastrar</a>
				}
			</nav>
			</mat-toolbar>
		</header>

		<sm-desafio-notification />

		<sm-cookie-notification />

		<main class="shell-main">
			<router-outlet />
		</main>

		<sm-footer />

		<sm-notification-host />
	</div>
</div>
